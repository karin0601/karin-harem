<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>臨帝闕後宮名冊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
/* 版面：跟宮鬥守則同一套夜宮黑金紅。一格一格圓形金框頭像，照位份排；點了跳出宮中檔案 */
@font-face { font-family: "HaoLong"; src: url("brush.woff2") format("woff2"); font-display: swap; }
:root {
  color-scheme: dark;
  --night: #0e0809; --night-2: #1a0f10;
  --ink: #efe2cf; --muted: #a99282;
  --gold: #d9b26a; --gold-hi: #f3d99a; --gold-line: rgba(217, 178, 106, .35);
  --red: #c8352c; --red-deep: #7a1a17;
  --card: rgba(30, 18, 19, .9);
  --good: #86c4ad; --bad: #e07a6f;
  --brush: "HaoLong", "Noto Serif TC", serif;
  --display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --body: "LXGW WenKai TC", "Noto Serif TC", "Kaiti TC", "DFKai-SB", serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { overflow-x: clip; }
body {
  margin: 0; background: var(--night); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 72px;
}
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: url("img/wave.webp") 0 0 / 180px; opacity: .045; }
a { color: var(--gold-hi); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.wrap { max-width: 1040px; margin: 0 auto; }
.gold-text { background: linear-gradient(170deg, var(--gold-hi) 10%, var(--gold) 45%, #a77a32 70%, var(--gold-hi) 95%); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* 開頭 */
header { position: relative; padding-block: 48px 28px; display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
header .deco { position: absolute; right: -60px; top: -10px; width: 380px; opacity: .45; pointer-events: none; z-index: -1;
  -webkit-mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 50%, transparent 100%); mask-image: radial-gradient(ellipse 50% 50% at 50% 50%, #000 50%, transparent 100%); }
.spaced { font-family: var(--display); font-weight: 600; letter-spacing: .6em; font-size: 13px; color: var(--gold); }
h1 { margin: 6px 0 0; font-family: var(--brush); font-weight: 400; font-size: clamp(64px, 11vw, 112px); line-height: 1; }
.meta { color: var(--muted); font-size: 14px; margin-top: 10px; }
.meta a { color: var(--muted); }
.find { display: flex; align-items: center; gap: 8px; border: 1px solid var(--gold-line); background: rgba(217, 178, 106, .05); padding: 6px 12px; min-width: 0; }
.find input { background: transparent; border: 0; color: var(--ink); font: inherit; width: 170px; max-width: 50vw; outline: none; }
.find input::placeholder { color: var(--muted); }

/* 章節 */
nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(14, 8, 9, .93); backdrop-filter: blur(6px);
  border-block: 1px solid var(--gold-line); display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; }
nav.tabs a { flex: none; text-decoration: none; color: var(--muted); padding: 8px 14px; letter-spacing: .1em; border-bottom: 2px solid transparent; }
nav.tabs a:hover { color: var(--gold-hi); border-bottom-color: var(--red); }
nav.tabs b { font-weight: 400; font-size: 13px; margin-left: 4px; color: var(--gold); font-variant-numeric: tabular-nums; }
section { padding-top: 44px; scroll-margin-top: 48px; }
h2 { margin: 0 0 22px; display: flex; align-items: center; gap: 14px; font-family: var(--brush); font-weight: 400; font-size: 46px; line-height: 1; }
h2 .no { flex: none; width: 40px; height: 40px; display: grid; place-items: center; background: var(--red); color: var(--ink); font-family: var(--display); font-weight: 900; font-size: 18px; transform: rotate(-3deg); }
h2 small { font-family: var(--body); font-size: 14px; color: var(--muted); letter-spacing: .1em; }

/* 頭像格 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 22px 12px; }
.who { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; min-width: 0; padding: 4px 2px; border-radius: 6px; }
.who:focus-visible { outline: 3px solid var(--gold); }
.who .ring { position: relative; width: 96px; height: 96px; border-radius: 50%; padding: 3px;
  background: conic-gradient(from 200deg, var(--gold-hi), var(--gold), #8d6327, var(--gold), var(--gold-hi)); transition: transform .2s, box-shadow .2s; }
.who .ring img { width: 100%; height: 100%; border-radius: 50%; display: block; border: 2px solid var(--night); object-fit: cover; background: #ccc0a8; }
.who:hover .ring { transform: translateY(-3px); box-shadow: 0 0 22px rgba(217, 178, 106, .4); }
.who .rank { font-family: var(--display); font-weight: 900; font-size: 13px; color: var(--red); letter-spacing: .12em; line-height: 1.2; }
.who .nm { font-size: 15px; line-height: 1.3; max-width: 100%; overflow-wrap: anywhere; }
.who .badge { position: absolute; right: -4px; bottom: 2px; font-size: 11px; line-height: 1; padding: 4px 6px; border-radius: 99px; background: var(--red); color: var(--ink); border: 1px solid var(--gold); white-space: nowrap; }
.who .badge.ill { background: #4d3a5c; }
/* 前三名（皇后、皇貴妃、貴妃）大一點 */
.who.top .ring { width: 118px; height: 118px; }
.who.dim { opacity: .2; }
.sub { margin: 30px 0 16px; font-family: var(--display); font-weight: 900; color: var(--gold-hi); letter-spacing: .3em; display: flex; align-items: center; gap: 12px; }
.sub::after { content: ""; flex: 1; height: 1px; background: var(--gold-line); }

/* 宮中檔案（切換成整頁） */
#detail { padding-top: 24px; }
.back { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; color: var(--gold-hi); border: 1px solid var(--gold-line); padding: 6px 16px; font-family: var(--display); font-weight: 600; letter-spacing: .15em; }
.back:hover { border-color: var(--gold); background: rgba(217, 178, 106, .08); }
.file { margin-top: 18px; display: grid; grid-template-columns: 380px minmax(0, 1fr); border: 1px solid var(--gold); background: var(--night-2);
  box-shadow: 0 0 0 6px var(--night), 0 0 0 7px var(--gold-line); }
.file .art { background: #ccc0a8; }
.file .art img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; min-height: 420px; }
.file .body { padding: 26px 28px 28px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.cold .who .ring { background: conic-gradient(from 200deg, #9aa3b5, #5d6577, #3a4050, #5d6577, #9aa3b5); }
.cold .who .ring img { filter: grayscale(.55) brightness(.85); }
.cold .who .rank { color: #9aa3b5; }
h2 .cold-t { background: linear-gradient(170deg, #dfe6f2, #8a93a6); -webkit-background-clip: text; background-clip: text; color: transparent; }
.file .t { font-family: var(--display); font-weight: 900; color: var(--red); letter-spacing: .2em; font-size: 14px; }
.file h3 { margin: 0; font-family: var(--display); font-weight: 900; font-size: 30px; line-height: 1.2; color: var(--gold-hi); padding-right: 36px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--muted); }
.facts b { color: var(--ink); font-weight: 700; }
.state { display: inline-block; padding: 0 8px; border: 1px solid var(--good); color: var(--good); font-size: 13px; }
.state.warn { border-color: var(--bad); color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; }
.stat { display: grid; grid-template-columns: 2.6em 3.4em minmax(0, 1fr); align-items: center; gap: 8px; font-size: 14px; }
.stat .k { color: var(--muted); }
.stat .v { font-family: var(--display); font-weight: 900; text-align: right; font-variant-numeric: tabular-nums; }
.stat .v.neg { color: var(--bad); }
.stat .bar { height: 6px; background: rgba(217, 178, 106, .12); position: relative; }
.stat .bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--gold), var(--gold-hi)); }
.stat .bar i.neg { background: var(--bad); }
.stat .tt { grid-column: 3; font-size: 12px; color: var(--gold); margin-top: -6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 13px; padding: 1px 10px; border: 1px solid var(--gold-line); color: var(--gold-hi); }
.chips span.tag { border-color: var(--red); color: var(--ink); background: rgba(200, 53, 44, .2); }
.row { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 14px; }
.row .k { color: var(--muted); letter-spacing: .1em; }
.kids-of { display: flex; flex-wrap: wrap; gap: 8px; }
.kids-of button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; padding: 2px 10px 2px 2px; border: 1px solid var(--gold-line); border-radius: 99px; }
.kids-of button:hover { border-color: var(--gold); }
.kids-of img { width: 26px; height: 26px; border-radius: 50%; }

footer { margin-top: 64px; text-align: center; color: var(--muted); font-size: 13px; letter-spacing: .15em; }

@media (max-width: 640px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 18px 8px; }
  .who .ring { width: 80px; height: 80px; }
  .who.top .ring { width: 96px; height: 96px; }
  .file { grid-template-columns: 1fr; }
  .file .art img { height: 340px; min-height: 0; object-fit: cover; object-position: 50% 8%; }
  .file .body { padding: 20px 18px 22px; }
  .stats { grid-template-columns: 1fr; }
  header .deco { width: 260px; }
}
@media (prefers-reduced-motion: reduce) { .who .ring { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
<div id="list">
  <header>
    <img class="deco" src="img/moon-mountain.webp" alt="">
    <div>
      <div class="spaced">臨帝闕　內務府存檔</div>
      <h1 class="gold-text">後宮名冊</h1>
      <div class="meta">照位份由高到低排列，點頭像看宮中檔案。資料更新：<span id="upd"></span>　｜　<a href="index.html">← 宮鬥守則</a></div>
    </div>
    <label class="find"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="找找自己的名字" autocomplete="off"></label>
  </header>

  <nav class="tabs" aria-label="分類">
    <a href="#consorts">妃嬪<b id="n-c"></b></a><a href="#princes">皇子<b id="n-p"></b></a><a href="#princesses">公主<b id="n-g"></b></a><a href="#cold">冷宮<b id="n-x"></b></a>
  </nav>

  <section id="consorts">
    <h2><span class="no">壹</span><span class="gold-text">妃嬪</span></h2>
    <div class="grid" id="g-c"></div>
  </section>
  <section id="princes">
    <h2><span class="no">貳</span><span class="gold-text">皇子</span><small>照出生排行</small></h2>
    <div class="grid" id="g-p"></div>
  </section>
  <section id="princesses">
    <h2><span class="no">參</span><span class="gold-text">公主</span><small>照出生排行</small></h2>
    <div class="grid" id="g-g"></div>
  </section>
  <section id="cold" class="cold">
    <h2><span class="no" style="background:#4a5163">肆</span><span class="cold-t">冷宮</span><small>古錦宮・庶人</small></h2>
    <div class="grid" id="g-x"></div>
  </section>

  <footer>數值依遊戲畫面抄錄，每次開播前更新</footer>
</div>
<div id="detail" hidden></div>
</div>

<script src="roster.js"></script>
<script>
(() => {
  const R = window.ROSTER;
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const RANKS = ['皇貴妃', '皇后', '貴妃', '夫人', '昭儀', '貴嬪', '婕妤', '容華', '婉儀', '小儀', '貴人', '美人', '常在', '選侍', '采女', '更衣', '妃'];
  // 「黃皇后」→「皇后」：位份放在名字前面，姓已經在名字裡了
  const rankOf = t => RANKS.find(r => t.endsWith(r)) || t;
  // ?v= 讓換過的頭像不會被瀏覽器記住舊的
  const face = id => `img/roster/${id}-face.webp?v=${R.ver || R.updated}`;
  const byId = {};
  R.consorts.forEach(c => byId[c.id] = c);
  R.cold.forEach(c => byId[c.id] = c);
  R.kids.forEach(k => byId[k.id] = k);
  const nameToConsort = {};
  R.consorts.concat(R.cold).forEach(c => nameToConsort[c.name] = c);

  $('#upd').textContent = R.updated;
  const princes = R.kids.filter(k => k.sex === '男'), princesses = R.kids.filter(k => k.sex === '女');
  $('#n-c').textContent = R.consorts.length; $('#n-p').textContent = princes.length; $('#n-g').textContent = princesses.length; $('#n-x').textContent = R.cold.length;

  const badge = p => p.state === '健康' ? '' : `<span class="badge${/病/.test(p.state) ? ' ill' : ''}">${esc(p.state.replace(/\(\d+\)/, ''))}</span>`;
  const tile = (p, rank, top) => `
    <button class="who${top ? ' top' : ''}" data-id="${p.id}" data-q="${esc((p.name + p.title).toLowerCase())}">
      <span class="ring"><img src="${face(p.id)}" alt="" loading="lazy">${badge(p)}</span>
      <span class="rank">${esc(rank)}</span><span class="nm">${esc(p.name)}</span>
    </button>`;
  $('#g-c').innerHTML = R.consorts.map((c, i) => tile(c, rankOf(c.title), i < 3)).join('');
  $('#g-p').innerHTML = princes.map(k => tile(k, k.title)).join('');
  $('#g-g').innerHTML = princesses.map(k => tile(k, k.title)).join('');
  $('#g-x').innerHTML = R.cold.map(c => tile(c, '庶人')).join('');

  // 找名字
  $('#q').addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    document.querySelectorAll('.who').forEach(b => b.classList.toggle('dim', !!q && !b.dataset.q.includes(q)));
    const hit = q && document.querySelector('.who:not(.dim)');
    if (hit) hit.scrollIntoView({ block: 'center', behavior: 'smooth' });
  });

  const MAX = 1200;
  const statRow = (k, v, t) => {
    const pct = Math.min(100, Math.abs(v) / MAX * 100);
    return `<div class="stat"><span class="k">${k}</span><span class="v${v < 0 ? ' neg' : ''}">${v}</span>
      <span class="bar"><i class="${v < 0 ? 'neg' : ''}" style="width:${pct}%"></i></span>${t ? `<span class="tt">${esc(t)}</span>` : ''}</div>`;
  };
  const chips = (arr, cls = '') => arr.length ? `<div class="chips">${arr.map(x => `<span class="${cls}">${esc(x)}</span>`).join('')}</div>` : '';
  const stateTag = s => `<span class="state${s === '健康' ? '' : ' warn'}">${esc(s.replace('(', '・').replace(')', ' 個月'))}</span>`;

  function consortFile(c) {
    const kids = R.kids.filter(k => k.mother === c.name || k.foster === c.name);
    return `
      <div class="t">${esc(c.title)}</div><h3>${esc(c.name)}</h3>
      <div class="facts"><span><b>${c.age}</b> 歲</span><span>健康 <b>${c.hp}</b></span>${stateTag(c.state)}</div>
      <div class="row"><span class="k">家世</span><span>${esc(c.family)}</span></div>
      <div class="row"><span class="k">居所</span><span>${esc(c.palace)}</span></div>
      <div class="stats">${Object.entries(c.stats).map(([k, s]) => statRow(k, s.v, s.t)).join('')}</div>
      <div class="row"><span class="k">性格</span><span>${esc(c.trait)}</span><span class="k" style="margin-left:10px">特長</span>${chips(c.skill)}</div>
      ${c.tags.length ? `<div class="row"><span class="k">標籤</span>${chips(c.tags, 'tag')}</div>` : ''}
      <div class="row"><span class="k">經驗</span><span>${c.exp}</span><span class="k" style="margin-left:10px">私庫</span><span>${c.purse.toLocaleString()} 銀兩</span></div>
      ${kids.length ? `<div class="row"><span class="k">皇嗣</span><div class="kids-of">${kids.map(k => `<button data-go="${k.id}"><img src="${face(k.id)}" alt="">${esc(k.title)} ${esc(k.name)}${k.foster === c.name ? '（養）' : ''}</button>`).join('')}</div></div>` : ''}`;
  }
  function kidFile(k) {
    const mom = nameToConsort[k.mother], fos = nameToConsort[k.foster];
    const link = (p, label) => p ? `<button data-go="${p.id}"><img src="${face(p.id)}" alt="">${esc(rankOf(p.title))} ${esc(p.name)}</button>` : esc(label);
    return `
      <div class="t">${esc(k.title)}</div><h3>${esc(k.name)}</h3>
      <div class="facts"><span>${k.sex === '男' ? '皇子' : '公主'}</span><span><b>${k.age}</b> 歲</span><span>健康 <b>${k.hp}</b></span>${stateTag(k.state)}</div>
      <div class="row"><span class="k">生母</span><div class="kids-of">${link(mom, k.mother)}</div>${k.foster ? `<span class="k" style="margin-left:10px">養母</span><div class="kids-of">${link(fos, k.foster)}</div>` : ''}</div>
      <div class="row"><span class="k">綜合評價</span><span style="font-family:var(--display);font-weight:900;color:var(--gold-hi);font-size:22px">${k.score.toLocaleString()}</span><span class="k" style="margin-left:10px">資質</span><span>${k.talent.v}【${esc(k.talent.t)}】</span></div>
      <div class="stats">${Object.entries(k.stats).map(([n, v]) => statRow(n, v)).join('')}</div>
      <div class="row"><span class="k">性格</span><span>${esc(k.trait)}</span><span class="k" style="margin-left:10px">私庫</span><span>${k.purse.toLocaleString()} 銀兩</span></div>
      ${k.tags.length ? `<div class="row"><span class="k">標籤</span>${chips(k.tags, 'tag')}</div>` : ''}`;
  }

  // 點頭像 → 整頁換成宮中檔案；按「返回名冊」或瀏覽器的上一頁回到原本的位置
  const list = $('#list'), detail = $('#detail');
  let listScroll = 0;
  function show(id) {
    const p = byId[id];
    if (!p) { detail.hidden = true; list.hidden = false; return false; }
    if (!list.hidden) listScroll = scrollY;
    detail.innerHTML = `<button class="back">← 返回名冊</button>
      <div class="file"><div class="art"><img src="img/roster/${p.id}.webp?v=${R.ver || R.updated}" alt="${esc(p.name)}的立繪"></div>
      <div class="body">${p.sex ? kidFile(p) : consortFile(p)}</div></div>`;
    list.hidden = true; detail.hidden = false;
    scrollTo(0, 0);
    return true;
  }
  function route() {
    const id = location.hash.slice(1);
    if (show(id)) return;
    // 回到名冊：回到剛剛看到的位置（或目錄點到的章節）
    const sec = id && id !== 'list' && document.getElementById(id);
    if (sec) sec.scrollIntoView(); else scrollTo(0, listScroll);
  }
  document.addEventListener('click', e => {
    const go = e.target.closest('.who, [data-go]');
    if (go) { location.hash = go.dataset.id || go.dataset.go; return; }
    if (e.target.closest('.back')) location.hash = 'list';
  });
  window.addEventListener('hashchange', route);
  route();
})();
</script>

</body>
</html>
